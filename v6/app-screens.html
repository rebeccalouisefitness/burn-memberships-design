<title>BURN app screens | BURN by Rebecca Louise</title>
<!-- Journey preview only: real screenshots of the BURN app (iPhone 16 Pro simulator, 15 Oct 2026),
     taken from the app with the "finish setting up" sign-in route. Shown one at a time with ?s=. -->
<style>
:root{--bg:#FAF8F6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
.scr{display:none}
.scr.on{display:block}
.scr img{display:block;width:100%;height:auto}
</style>
</head>
<body>
<!-- 1. Opens BURN for the first time: Sign in on Home -->
<section class="scr" data-s="open"><img src="img/app/finish/open.jpg" alt="BURN app Home with a Sign in button at the top" width="600" height="1304"></section>
<!-- 2. Sign in with the email and password from checkout -->
<section class="scr" data-s="signin"><img src="img/app/finish/signin.jpg" alt="BURN app sign in screen: Welcome back, email, password, Sign in" width="600" height="1304"></section>
<!-- 3. Let's finish setting up: where she's at -->
<section class="scr" data-s="stage"><img src="img/app/finish/stage.jpg" alt="Welcome to BURN, Jess. Let's finish setting up. Where are you at right now?" width="600" height="1304"></section>
<!-- 4. Her goal (General fitness branch) -->
<section class="scr" data-s="goal"><img src="img/app/finish/goal.jpg" alt="What are you working toward? Lose weight, Tone up, Build muscle" width="600" height="1304"></section>
<!-- 5. Make it yours, with Skip for now -->
<section class="scr" data-s="yours"><img src="img/app/finish/yours.jpg" alt="Make it yours: photo, birthday, what to call you, why you started, Skip for now" width="600" height="1304"></section>
<!-- 6. In the app with BURN+ -->
<section class="scr" data-s="home"><img src="img/app/finish/home.jpg" alt="BURN app Home: Good morning, Jess, with BURN+ class scheduling" width="600" height="1304"></section>
<script>
(function () {
  var q = new URLSearchParams(location.search), s = q.get('s') || 'open';
  if (s === 'welcome') s = 'stage'; // older links
  var el = document.querySelector('[data-s="' + s + '"]') || document.querySelector('[data-s="open"]');
  el.classList.add('on');
})();
</script>
</body>
</html>
