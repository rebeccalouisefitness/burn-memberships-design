<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Upgrade | BURN by Rebecca Louise</title>
<!-- ⚠️ PLUMBING PAGE (see PLUMBING.md). Opened only from inside the BURN app, in a secure in-app
     browser sheet, for members who joined on the website. Looks like the "Confirm" sheet in
     membership-designs.html. The data-* attributes and js/burn-upgrade.js must stay. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--mauve:#956C7D;--mauveDeep:#6f4c5b;--rose:#f3e6ea;--appBg:#fbf8f6;--ink:#2a2326;--soft:#6d6468;--line:#ece4e7}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:rgba(40,25,32,.28);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:12px 22px calc(26px + env(safe-area-inset-bottom))}
.grab{width:38px;height:4px;border-radius:2px;background:#e3dcdf;margin:0 auto 18px}
.big{font:600 30px/1.1 'Cormorant Garamond',serif;margin:0}
.diff{background:var(--rose);border-radius:14px;padding:13px 15px;margin:16px 0;font-size:15px;color:var(--mauveDeep)}
.diff b{font-size:17px}
.card{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14.5px}
.brand{font:700 10px Inter,sans-serif;color:#1a1f71;border:1px solid #d9dbe8;border-radius:4px;padding:2px 5px;text-transform:uppercase}
.chg{margin-left:auto;color:var(--mauveDeep);font-weight:600;font-size:14px;background:none;border:0;padding:4px 0;cursor:pointer;font-family:inherit}
.btn{display:block;width:100%;border:0;text-align:center;background:var(--mauve);color:#fff;border-radius:999px;padding:16px 10px;font:600 15.5px Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn[disabled]{opacity:.55;cursor:default}
.err{color:#9b3b4a;font-size:13.5px;margin:12px 2px 0;text-align:center}
.ok{text-align:center;padding:26px 6px 6px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--rose);color:var(--mauve);display:grid;place-items:center;margin:0 auto 16px;font-size:30px}
.soft{color:var(--soft);font-size:15px;margin:8px 10px 22px}
.test{font-size:11px;color:var(--soft);text-align:center;margin-top:12px}
.sk{background:#f1ebe7;border-radius:8px;height:18px;margin:10px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="sheet" aria-live="polite">
  <div class="grab"></div>

  <div data-up-loading><div class="sk" style="width:70%;height:30px"></div><div class="sk" style="height:58px"></div><div class="sk" style="height:46px"></div></div>

  <section data-up-confirm hidden>
    <h1 class="big"><span data-up-plan></span> &middot; <span data-up-price></span></h1>
    <div class="diff" data-up-diff></div>
    <div class="card" data-up-card><span class="brand" data-up-brand></span><span>&bull;&bull;&bull;&bull; <span data-up-last4></span></span><button type="button" class="chg" data-up-change>Change</button></div>
    <button type="button" class="btn" data-up-submit></button>
    <p class="err" data-up-err hidden></p>
    <p class="test" data-up-test hidden>Test mode. No real money is taken.</p>
  </section>

  <section class="ok" data-up-done hidden>
    <div class="tick">&#10003;</div>
    <h1 class="big">Welcome to <span data-up-plan-done></span></h1>
    <p class="soft">Everything&rsquo;s unlocked.</p>
    <a class="btn" data-up-back href="burn://membership">Back to BURN</a>
  </section>

  <section class="ok" data-up-gone hidden>
    <h1 class="big" style="font-size:26px">This link has expired</h1>
    <p class="soft" data-up-gone-msg>Go back to the BURN app and tap Upgrade again.</p>
    <a class="btn" href="burn://membership">Back to BURN</a>
  </section>
</main>
<script src="js/burn-upgrade.js"></script>
</body>
</html>
